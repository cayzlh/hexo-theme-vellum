# Vellum Theme — Minimal and elegant Hexo theme
# https://github.com/cayzlh/hexo-theme-vellum

info:
  name: Vellum
  version: 0.5.2

# =============================================
# 界面语言（i18n）
# =============================================
# 主题自带的界面文案（按钮、aria-label、空状态、<title> 后缀、页脚署名…）
# 跟着这里的语言走。**文章正文不归它管**——正文语言由你写的 Markdown 决定。
#
# 可选值：auto | zh-CN | zh-TW | en
#   auto   跟随站点 _config.yml 的 language（取数组第一项），推荐
#   zh-CN  简体中文（基准语言；其它语言缺的键都回落到它）
#   zh-TW  繁體中文（台灣用語）
#   en     English
#
# 语言包在主题的 languages/ 目录：languages/zh-CN.yml 等。
# 想改某一句文案，两种办法：
#   1. 改语言包（影响整站，升级主题时会被覆盖，谨慎）；
#   2. 用下面那些原有的配置项覆盖单条（toc.back_to_top_text、
#      archive.search_placeholder、subscriptions.page_title…），
#      配置项优先级始终高于语言包。
#
# 加新语言：放一个 languages/<code>.yml，再把 code 加到 scripts/lib/i18n-core.js
# 的 LANG_ALIAS 里即可。缺失的键自动回落中文，不必一次翻完。
i18n:
  lang: auto

# 主标题 & 副标题（来自站点 _config.yml 的 title / subtitle）
# title 显示在 header 左侧，subtitle 显示在 header 右侧

# Navigation links
# ========================================
# 导航菜单。这里刻意留空：菜单完全由站点的 _config.<theme>.yml 提供。
#
# 为什么不留示例菜单：Hexo 的主题二级配置用 deepMerge 合并，而它对数组是
# **按索引**递归合并的。如果主题里预留了带 children 的示例项，站点菜单在
# 同一索引上新增一项时，会把那个示例项的 children 继承过去——表现为
# 一个普通外链莫名变成下拉菜单。留空数组可彻底避免这类串味。
#
# 字段说明（在站点配置里写）：
#   name     - 显示名称
#   url      - 内部路径或完整 URL
#   target   - '_self' | '_blank'，外链建议 _blank（模板会自动补 rel=noopener）
#   children - 子菜单；有此项则渲染为下拉
#   divider  - 仅用于 children，true 表示分割线
menu: []

# ========================================
# 导航高亮的兜底
# ========================================
# 写一个菜单项的 url。当**没有任何**菜单项匹配当前页面时，把高亮给它。
#
# 用途：只在页脚出现、顶栏里没有归属的页面（工具页、独立落地页）。
# 没有这条时，这类页面打开后整条顶栏一个都不亮，读者会以为走丢了。
#
#   menu_active_fallback: '/'      # 兜底到首页
#   menu_active_fallback: ''       # 不要兜底（默认）
#
# 留空默认即不启用，不改变任何现有站点的行为。
menu_active_fallback: ''

# =============================================
# Homepage
# =============================================

# Homepage intro
intro: |
  A brief introduction about yourself or your blog.

  Supports **Markdown** formatting. This text appears on the homepage.

  — Your Name

recent_posts_count: 5
# 这两个标题留空 = 用语言包里的文案（languages/<lang>.yml 的 home.recent_posts）。
# 在这里写死会压过语言包——主题以前写死了英文，切到中文的站点也得看见
# "Recent Posts:"。要固定某个说法时再填。
recent_posts_title: ''
# 「近日所思」右下角「查看文章」的去处。默认 /archives/（全部文章）。
# 配成 '' 或 false 则不显示这个入口。
# recent_more_url: '/archives/'
# 「旧文拾遗」的条数。**配 0 或 false 会整块关掉**（含标题），
# 不是「回退到默认 5 条」——模板里先判 `!= null`，再判真假值。
random_posts_count: 5
random_posts_title: ''

# =============================================
# 首页每日壁纸（窄幅 banner）
# =============================================
# 首页顶部（或 intro 之后）一条窄幅的必应每日一图。
#
# **构建期抓取，静态写进 HTML**：首页是几小时重建一次的静态产物，没必要让
# 每个访客各自请求一次接口，也没必要让首屏多等一个网络往返。抓到的结果按天
# 缓存在站点根目录的 .banner_cache.json（已在 .gitignore），同一天重复构建
# 不再请求。
#
# 数据源：{api_base}/v2/bing，响应形如
#   { code: 200, data: { title, copyright, cover, cover_4k, update_date, … } }
# 任何兼容 60s-API 的实例都行，通常就是下面 daily.api_base 那一个。
#
# **降级**：接口挂了 / 响应不成形 / 图地址不可用，整块 banner 不渲染。
# 首页宁可没有这一条，也不能留一块灰底或一张破图——它是锦上添花，
# 缺了它首页依然完整。
banner:
  # 总开关。false 时连缓存都不读，首页完全不出现这块。
  enable: true
  # 数据源。留空则回落到 daily.api_base（壁纸和资讯本来就是同一个上游）。
  api_base: ''
  # 桌面端高度，写 CSS 长度（数字 + px/rem/em/vh/vw）。
  # 200px 左右是「看得见、不抢注意力」的尺度；移动端会改按宽高比自适应。
  # 形状不合法会被忽略并回落默认值——这个值最终拼进 style 属性。
  height: 200px
  # 放置位置：
  #   top          首页 intro 之前（默认，一进来就是图，适合视觉型站点）
  #   after-intro  简介与分割线之后、「近日所思」之前（更含蓄，文字优先）
  position: top
  # 点击图片是否跳转必应每日壁纸页。false 时图纯装饰，不可点。
  link: true
  # 图上是否压一层暗渐变。壁纸明暗不可控，没有这层的话白色标题
  # 在某些图上会糊掉；图本来就偏暗时可以关掉。
  overlay: true
  # 是否显示壁纸标题（必应给的主题词，如「归来的草原巨兽」）
  show_title: true
  # 是否显示版权署名（© 摄影者 / 图库）
  show_copyright: true

# =============================================
# 分割线（<hr>）
# =============================================
# 主题把 <hr> 当成「视觉停顿」而非功能性分隔，内置 6 种样式。
#
# 用法：在 Markdown 里直接写带 class 的 hr
#   <hr class="short">
#   <hr class="ornament">
#   <hr class="style-short">   ← 等价的 style- 前缀写法
#
# 可用样式：
#   gradient — 两端渐隐
#   short    — 64px 居中短横线
#   dotted   — 点线组合 ·
#   double   — 超细双线
#   ornament — ✦ ✦ ✦ 花饰
#   dash-dot — — · — · — 变体
#
# 注意：主题只对**首页文章之间**的分隔线读取下面的 home_style；
# 正文里的 <hr> 用什么样式，由你在 Markdown 中写的 class 决定。
hr:
  home_style: gradient

# =============================================
# SEO
# =============================================

# Canonical URL + 镜像站检测
# ---------------------------------------------------------------
# originalHost 留空 = 完全关闭这两个功能（本地开发时建议留空）。
# 填了之后：
#   1. 每页输出 <link rel="canonical">，指向你自己的域名
#   2. 别人用其它域名镜像你的站点时，页面顶部出现一条提示条
canonical:
  originalHost: ''            # 你的主域名，例如 'www.example.com'
  officialHosts: []           # 额外认可的域名，例如 ['example.com']

# Open Graph (social sharing)
open_graph:
  enable: true
  twitter_id: ''
  twitter_card: summary_large_image

# Structured data (JSON-LD)
structured_data:
  enable: true
  site_type: Person
  logo: ''

# =============================================
# =============================================
# Colors — 浅色模式
# =============================================
# 这里的值会由 layout/_partial/head.ejs 投影成 :root 上的 CSS 自定义属性，
# 覆盖 source/css/tokens.css 的默认值。也就是说：**改这里就生效**，不用碰 CSS。
#
# 留空（或整段删掉）则回落到 tokens.css 的默认值。
# 想改颜色又不想改 YAML 的话，也可以直接在 CSS 里覆盖同名变量。
color:
  # OnePage：中性白底 + 深青强调。四个表面层级等亮度递增，
  # 每一级相差 4~6%，既能分层又不会让页面读起来发灰。
  text: '#3D3730'
  text-light: '#79705F'
  text-muted: '#6B6255'
  background: '#FFFFFF'
  background-secondary: '#F5F5F5'
  background-tertiary: '#EDEDED'
  link: '#0E6E63'
  link-hover: '#0A544B'
  accent: '#0E6E63'
  # 强调色填充块（按钮等）上的文字颜色。
  # 浅色模式 accent 是深青，白字对比 6.1:1；改成浅色 accent 时记得一起换。
  on-accent: '#FFFFFF'
  border: '#E8E8E8'
  border-dark: '#D4D4D4'
  code-bg: '#F5F5F5'
  code-border: '#E3E3E3'
  selection: '#E6E6E6'

# =============================================
# 链接颜色
# =============================================
# 这两个值会被投影成 --c-link / --c-link-hover，覆盖 color: 里的同名项。
# 留空则沿用 color.link / color.link-hover。
link:
  color: '#0E6E63'
  hover_color: '#0A544B'

# Typography — 同样会被投影成 --fs / --lh / --mw
font_size: 16.5px
line_height: 1.72
max_width: 680px


# =============================================
# Dark Mode
# =============================================
dark_mode:
  # 三种模式：
  #   manual — 右上角开关手动切换，选择记在 localStorage（默认）
  #   auto   — 按下面的日落/日出时间自动切换，不显示开关
  #   system — 跟随操作系统的 prefers-color-scheme
  mode: manual
  # 仅 mode: auto 时生效
  sunset: '19:00'
  sunrise: '06:00'

dark:
  # OnePage 暖棕·冷锚：暖棕底 + 冷青强调
  text: '#CFC7BD'
  text-light: '#A49C90'
  text-muted: '#948D83'
  background: '#262322'
  background-secondary: '#2D2927'
  background-tertiary: '#1F1C1B'
  link: '#6DB3A3'
  link-hover: '#8CC9BA'
  border: '#3A3532'
  code-bg: '#201D1C'
  hover-bg: '#332E2C'
  accent: '#6DB3A3'
  # 深色模式 accent 变浅，白字只有 2.4:1，必须用深色前景（6.4:1）。
  on-accent: '#201D1C'
  selection: '#43392F'

# =============================================
# 页面过渡动画
# =============================================
transition:
  # 关掉它就完全不做页面切换动画
  enable: true
  # 动画时长（毫秒）。与 CSS 里的淡入时长保持一致，
  # 改这里请同时改 source/js/transition.js 的 CONFIG.duration。
  duration: 350

# =============================================
# TOC（目录）
# =============================================
# 桌面：正文右侧（或左侧）的固定侧栏，滚动时跟随高亮
# 移动：右下角悬浮球的「目录」格 → 底部面板
toc:
  # 总开关。false 时侧栏与移动面板都不渲染
  enable: true
  # 收录到第几级标题（1-6）。标题更深的层级不进入目录
  max_depth: 3
  # 桌面侧栏位置：'right' | 'left'
  position: right
  # 桌面侧栏宽度。改它会自动重算定位，不会跑出视口
  width: 200px
  # 手机上目录面板的初始状态：'collapsed' | 'expanded'
  mobile_default: collapsed
  # 是否显示「回到顶部」按钮
  show_back_to_top: true
  # 按钮文字。留空 = 用语言包（common.back_to_top）
  back_to_top_text: ''
  # 自动折叠：只展开当前所在章节，其余子层级收起
  auto_collapse: true
  # 滚动时高亮当前阅读的标题
  highlight_on_scroll: true
  # 是否绘制层级连接线（树形可视化）
  show_tree_line: true

# =============================================
# Dossier 档案系统
# =============================================
#
# 每个项目 = source/dossier/ 下的一个目录，必须含 index.md 作为项目首页。
# index.md 的 front-matter 承担项目配置（title / description / tags / sort）。
#
# 配置优先级：index.md front-matter > 这里的 _config.yml
#
dossier:
  # 总开关。false 时整个 /dossier/ 不生成
  enable: true
  # URL 路径（同时也是 source 下的目录名）
  path: dossier
  # 是否显示文档页底部的「上一篇 / 下一篇」
  show_pagination: true
  # 项目卡片（/dossier/ 索引页）的展示开关
  card:
    show_tags: true
    show_description: true
    show_count: true
    # 描述最多显示几行，超出省略（设为 0 / 不填则不限制）
    description_lines: 2
    # 项目首页底部的「开始阅读」入口
    show_start_button: true
    # 按钮文字。留空 = 用语言包（dossier.start_reading）
    start_button_text: ''
    # 按钮样式：'default'（实心）| 'minimal'（纯文字）| 'outline'（描边）
    start_button_style: default


# =============================================
# Custom pages（自定义页面）
# =============================================
# 不需要任何配置：把普通 Markdown/HTML 放到站点的 source/<任意目录>/ 下，
# Hexo 会按常规页渲染，主题自动套用 page.ejs。
#
# 页面级别的微调有两个现成的口子：
#
#   1. 隐藏主题自动生成的标题（页面自己画了 <h1> 时用）
#      ---
#      title: 某个工具页
#      hide_title: true
#      ---
#
#   2. 改正文宽度之类，直接在页面里写 <style>，它会随页面一起输出：
#      <style>.content { max-width: 800px; }</style>
#
# 需要一整套不同的 DOM 结构时，才在主题 layout/ 下加同名 .ejs 并在
# front-matter 里指定 layout——但那种页面通常属于站点自己，不建议塞进主题。

# =============================================
# 移动端体验配置
# =============================================
mobile:
  # 是否启用移动端优化（总开关）。
  # false 时：不加载 mobile.css / mobile.js，
  # 悬浮球与底部目录面板都不渲染，移动端回到「顶部汉堡菜单」形态。
  enable: true

  # 右下角悬浮球（借鉴 Stellar 的 site-dock）
  # 一枚竖向胶囊，每格一个入口：
  #   · 目录 — 只有页面确实有标题时才渲染（无目录的页面不会出现死键）
  #   · 导航 — 站点菜单，始终存在
  # enable 为 false 时整块不渲染，移动端回到「无浮层入口」状态。
  dock:
    enable: true
    # 距屏幕右侧 / 底部的距离（px；底部会自动叠加 iOS 安全区）
    offset_x: 16
    offset_y: 16
    # 图标边长（px）。22 是 44px 触控区内的舒适比例。
    icon_size: 22

# =============================================
# 订阅页面配置
# =============================================
# 在 hexo generate 时抓取 RSS/Atom 订阅源，生成 /subscriptions/ 页面
#
# 数据来源：source/_data/subscriptions.yml
#   可选再叠加一份远程列表（见下方 remote 段），两者合并后一起抓取。
#
subscriptions:
  # 每个源默认抓取条数
  default_limit: 3
  # 是否显示订阅源描述
  show_description: true
  # 是否在 /subscriptions/ 页脚展示「正在关注 · N 个源」这块源清单。
  # 默认 true（老站点行为不变）。配 false 后连标题一起不渲染，
  # 整页只留文章流——适合「只想让人读文章、不想公开订阅了谁」的场景。
  show_sources: true
  # 页面标题（仅用于 <title>/SEO，页面上不渲染大标题）。
  # 留空 = 用语言包（subscriptions.page_title）
  page_title: ''
  # 请求超时（毫秒）
  timeout: 10000
  # 文章流上方的一句说明；留空则不显示。
  # page_note: '我一直在读的东西，按时间倒序排列。'

  # ---- 首页「逛逛博客」模块 ----
  # 首页底部展示最近的几条订阅更新。没有可展示的条目时整块（含标题）
  # 都不渲染，所以不需要额外的开关来防止空模块。
  home_enable: true
  home_count: 3
  # 模块标题。留空 = 用语言包（home.visiting）
  home_title: ''
  # 列表右下角「查看更多」的去处。默认 /subscriptions/——首页这块是它的
  # 摘要，整份列表在那边。配成 '' 或 false 则不显示这个入口。
  # home_more_url: '/subscriptions/'

  # ---- 远程订阅列表（可选）----
  # 构建期额外拉一份订阅列表，和本地 yml 合并后再抓 feed。
  # 典型场景：用 Chrome 插件/hub 随手存一个新源，下次部署就自动出现在页面上，
  # 不必回来改 yml、不必重新提交。
  #
  # **默认关闭**。不打开时完全不发这个请求，/subscriptions/ 的产物与没有
  # 这个功能时逐字节一致——老站点不需要做任何事。
  #
  # 接口是只读公开的，不带任何凭据（订阅列表本来就整页公开渲染，
  # 公开可读不增加暴露面）。契约见 hub 仓库 docs/01-api-contract.md：
  #   GET {api_base}{path}
  #   { "version": 1, "updatedAt": 1234567890, "subscriptions": [ … ] }
  #
  # **失败不影响构建**：超时 / 非 2xx / JSON 解析失败 / Node 太老没有
  # 全局 fetch，一律只 warn 一行，然后拿本地 yml 继续构建。
  remote:
    # 总开关。必须是 true（或配置里写字符串 'true'）；
    # 写成 'false' 之类的字符串一律当关闭处理，避免手滑。
    enable: false
    # hub 的地址，不带结尾斜杠。开了 enable 却没配这个，会 warn 并跳过远程拉取。
    # api_base: 'https://hub.cayzlh.com'
    # 公开只读接口路径，默认值一般不用改。
    # path: '/api/subscriptions/public'
    # 拉列表的超时（毫秒）。超时就退回本地配置——构建机没耐心等太久，
    # 这个值和下面抓 feed 的 timeout 是两回事。
    # timeout: 5000
    # 合并模式：
    #   remote-first（默认） 远程记录在前，远程留空的 name/description/icon/
    #                        limit/homepage 用本地补，本地独有源接在后
    #   local-first          镜像规则：本地在前，远程补空
    #   remote-only          只用远程，忽略本地 yml
    # 同一 URL 只保留一条；URL 按「协议与主机小写、去尾部斜杠、去 fragment」
    # 归一化后比较，所以 https://a.com/feed 与 https://a.com/feed/ 是同一条。
    # merge: remote-first

  # ---- 兜底订阅源 ----
  # 站点没有配置 source/_data/subscriptions.yml（或配成空列表）时，
  # 用下面这份默认值，让 /subscriptions/ 与首页模块开箱就有内容。
  # 站点一旦自己配了订阅源，这里的内容不会被采用。
  #
  # 默认只放本主题站自己的订阅源：它是最"安全"的默认值——永远存在、
  # 永远和主题版本同步，也不会替使用者决定该关注谁。
  # 想看更多来源，自己建 source/_data/subscriptions.yml 即可。
  #
  # 字段与数据文件完全一致：
  #   name / url / homepage / limit / icon / description
  defaults:
    - name: Vellum 主题
      url: https://www.cayzlh.com/atom.xml
      homepage: https://www.cayzlh.com
      limit: 3
      icon: ✦
      description: 本主题的更新与说明文档

# =============================================
# 收藏站点页（/links/）
# =============================================
# 独立的收藏站点页：分组卡片，每组一个 category 小标题。
#
# 数据来源（按优先级从高到低，前两个本地文件可以并存，可以只用一个）
#   1. source/_data/bookmarks.yml   平铺，每条自带 category / sort —— 新格式
#   2. source/_data/links.yml       分组（category + items）—— 老格式，
#                                   同时喂着文章页的 show_links 友链组件，
#                                   格式不要改
#   3. 远程 hub 的公开接口（见下面 remote）
#
# 两个本地文件按 URL 归一化后去重：同一个站只出现一次，后出现的整条丢弃，
# 不做字段互补（两处写同一条记录本身就是重复配置）。远程只补本地没有的站，
# 同一条记录**本地优先**——手写的文案比插件抓的标题贴切。
#
# 页面是生成器注册的，不依赖导航菜单：只要开了 enable，/links/ 就存在。
bookmarks:
  # 总开关。false 时不生成 /links/ 页面（不是生成一个空页）。
  enable: true
  # 页面标题（用于大标题与 <title>/SEO）。留空 = 语言包 links.title。
  page_title: ''
  # 标题下的一句说明，留空则不渲染。
  # page_intro: '常翻的几个站，以及几件顺手的工具。'
  # 标题上方是否显示「N 个站 · M 个分类」。默认开——一页收藏最该先交代
  # 的就是规模；站点觉得多余可以关掉。
  show_count: true

  # ---- 远程收藏列表（可选）----
  # 构建期额外拉一份收藏列表，和本地文件合并。
  # 典型场景：用 Chrome 插件/管理台随手存一个站，下次部署自动出现，
  # 不必回来改 yml、不必重新提交。
  #
  # **默认关闭**。不打开时完全不发这个请求，/links/ 的产物与没有这个功能
  # 时逐字节一致——老站点不需要做任何事。
  #
  # 接口是只读公开的，不带任何凭据（收藏列表本来就整页公开渲染）。契约见
  # cayzlh-hub 仓库 chromeextension/docs/01-api-contract.md 第 6.3 节：
  #   GET {api_base}{path}
  #   { "version": 1, "updatedAt": 1234567890, "bookmarks": [ … ] }
  #
  # **失败不影响构建**：超时 / 非 2xx / JSON 解析失败 / 响应里没有
  # bookmarks 数组 / Node 太老没有全局 fetch，一律只 warn 一行，
  # 然后拿本地文件继续构建。
  remote:
    # 总开关。必须是 true（或配置里写字符串 'true'）；
    # 写成 'false' 之类的字符串一律当关闭处理，避免手滑。
    enable: false
    # hub 的地址，不带结尾斜杠。开了 enable 却没配这个，会 warn 并跳过。
    # api_base: 'https://hub.cayzlh.com'
    # 公开只读接口路径，默认值一般不用改。
    # path: '/api/bookmarks/public'
    # 拉列表的超时（毫秒）。超时就退回本地文件。
    # timeout: 5000

# =============================================
# Runtime (实时运行时间)
# =============================================
runtime:
  enable: true                          # 是否在首页简介下方显示运行时长
  start_time: '2020-01-01 00:00:00'     # 起始时间，用于计算"已平稳运行"的时长


# =============================================
# Footer
# =============================================
# 默认页脚只有一行署名：
#   本博客由 Hexo 驱动，使用 Vellum 主题制作。
# 下面每一项都是可选的，按需打开。
footer:
  # ---- 联系方式（可选）----
  # 支持 HTML，留空则不渲染这一行。
  # text: |
  #   <a href="mailto:hello@example.com">发邮件到 hello@example.com</a>

  # ---- 版权行（可选）----
  # 留空则自动生成 © {年份} {站点标题}
  # copyright: '© 2020–2026 Your Name'

  # ---- 驱动 / 主题署名（默认开启）----
  # 「本博客由 Hexo 驱动，使用 Vellum 主题制作。」
  # 两个产品名自动带超链接。不想显示这一行就设 false。
  # themed_by: false
  # hexo_url: 'https://hexo.io/'
  # vellum_url: 'https://github.com/cayzlh/hexo-theme-vellum'

  # ---- 页脚导航（可选）----
  # 配置后页脚变为左右两栏：左=联系方式 + 版权 + 署名，右=竖排导航。
  # 未配置时保持居中单列布局。
  #
  # 两种写法，二选一：
  #
  #   1. links —— 单列，最简写法
  #      links:
  #        - name: 归档
  #          url: /archives/
  #        - name: RSS
  #          url: /atom.xml
  #
  #   2. nav_columns —— 多列，从左到右排列；每列可选 title
  #      nav_columns:
  #        - links:                      # 第一列（最左）
  #            - name: 订阅
  #              url: /subscriptions/
  #            - name: 资讯
  #              url: /news/
  #        - links:                      # 第二列
  #            - name: 归档
  #              url: /archives/
  #            - name: RSS
  #              url: /atom.xml
  #            - name: 访问统计
  #              url: https://stats.example.com
  #              external: true
  #
  # 两者都配时 nav_columns 优先。列与列之间自动画一道分隔竖线，
  # 第一列左侧不留线（与单列时的观感一致）。

  # ---- 版权行末尾的 RSS 图标（可选）----
  # 做成图标而不是文字链接：版权行已经是一串字，再塞一个「RSS」词会把
  # 这一行读成一堆并列链接；图标把「订阅」这个动作压成一个记号。
  # 画法与页脚其它图标一致（24×24 描边、currentColor），深浅色自动适配。
  # url 留空则整块不渲染。
  # rss:
  #   url: /atom.xml
  #   title: RSS 订阅

  # ---- 站点自己的挂件（可选）----
  # 友链徽章、公约标识、备案号之类，原样输出到页脚最上方。
  # 配套样式和素材请放在站点侧——这类东西属于站点，不属于主题的通用能力。
  # custom_html: |
  #   <div class="my-badge">...</div>

# =============================================
# Archive 归档页搜索
# =============================================
archive:
  # 是否启用搜索功能
  search_enable: true
  # 搜索框占位文字。留空 = 用语言包（archive.search_placeholder）
  search_placeholder: ''
  # 搜索防抖延迟（毫秒）
  search_debounce: 200
  # 是否高亮匹配关键词
  highlight_match: true
  # 是否显示搜索匹配数量
  show_match_count: true

# =============================================
# Search 全站搜索（/search/）
# =============================================
# 构建期把文章与档案正文抽成纯文本，生成 /search.json（或分片），
# 前端 /search/ 页拉取后在浏览器里做子串检索。
#
# 与上面的 archive.search_enable 是两件事：
#   archive.*   归档页的**标题过滤**，纯 DOM，不额外传输数据
#   search.*    全站**正文检索**，需要一份索引
search:
  # 总开关。false 时不生成索引，/search/ 页仍可打开但搜不出东西。
  enable: true
  # 每篇正文保留多少字符进索引。
  # 调大会提高长文深处的命中率，代价是索引线性变大：
  # 本站 181 篇，1500 字 ≈ 527 KB（gzip 202 KB），不限长度 ≈ 977 KB。
  text_limit: 1500
  # 分片大小（篇/片）。超过这个数就把索引切成 search-0.json、search-1.json…
  # 前端并发拉取；文章数突破几百篇时才有意义，但结构先留好。
  shard_size: 120
  # 页面标题。留空 = 用语言包（search_page.title）
  page_title: ''
  # 页面描述。留空 = 用语言包（search_page.description）
  page_description: ''

# =============================================
# Daily News — 60s-API 数据源
# =============================================
# 驱动 /news/ 页面（构建期抓取 → 静态产物），以及首页每日壁纸 banner
# 的默认数据源（banner.api_base 留空时回落到这里的 api_base）。
#
# 数据源：任何兼容 60s-API 协议的实例。
#   · 官方公共实例（默认）：https://60s.viki.moe
#   · 自部署：https://github.com/vikiboss/60s
#   · 反代 / 自定义域名亦可，只要路径前缀仍是 /v2/
#
# 官方实例的四种响应形态（同一个 /v2/60s 端点）：
#   https://60s.viki.moe/v2/60s                    JSON（本主题使用这种）
#   https://60s.viki.moe/v2/60s?encoding=text      纯文本
#   https://60s.viki.moe/v2/60s?encoding=image     重定向到原图 CDN
#   https://60s.viki.moe/v2/60s?encoding=image-proxy 代理直链，直接返回图片
#
# 缓存：首次构建后写入 .daily_cache.json（站点根目录，已在 .gitignore），
#       同一天内重复构建不再请求 API，避免 hexo server 反复打接口。
daily:
  # 总开关（false 时 /news/ 渲染为空状态，适合纯本地开发）
  enable: true
  # 60s-API 地址。末尾斜杠会被自动去掉。
  api_base: 'https://60s.viki.moe'

  # ---- 各栏目开关 ----
  # 每日早报（/v2/60s）
  zaobao:
    enable: true
  # 知乎热榜（/v2/zhihu）
  zhihu:
    enable: true
  # 微博热搜（/v2/weibo）
  weibo:
    enable: true
  # 历史上的今天（/v2/today-in-history）
  history:
    enable: true
  # AI 资讯（/v2/ai-news）
  ai_news:
    enable: true
  # Hacker News（/v2/hacker-news/top）
  hacker_news:
    enable: true
  # 摸鱼进度（/v2/moyu），提供「周末还有 N 天」徽章
  moyu:
    enable: true
  # 今日运势（/v2/luck），提供「🍀 运势」徽章
  luck:
    enable: true
