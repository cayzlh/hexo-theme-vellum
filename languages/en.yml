# ---- Search page (/search/) ----
search_page:
  title: Search
  description: Full-text search across every post and dossier chapter, with results ranked by relevance and matched fragments highlighted.
  intro: Search the body text of posts and dossier chapters. Separate words with spaces; every word must match.
  placeholder: Search post content...
  clear: Clear
  loading: Loading index...
  result_count: '%d results (out of %d documents)'
  truncated: Showing the first %d only; try a more specific term.
  empty_title: Nothing matched
  empty_hint: Try different words, or use fewer keywords.
  error: Failed to load the index. Please reload and try again.
