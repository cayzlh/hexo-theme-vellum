# Vellum — 简体中文（默认语言）
# ---------------------------------------------------------------------------
# 这是「基准语言」：其它语言缺失的键会回落到这里，所以新增文案先加进本文件。
#
# 取值约定：
#   · 纯文本，不要写 HTML（模板会把值原样插入属性里，如 aria-label / title）
#   · 需要插值的地方用 printf 风格占位符，例如 "%s" / "%d"，模板侧用 tr(key, arg)
#   · 想改某一条文案，优先改站点侧的 theme 配置（如 toc.back_to_top_text），
#     配置项优先级高于语言包——语言包只是默认值

