# ---- 收藏站点（/links/）与文章页友链 ----
# links.title 由两处共用：独立的收藏站点页（大标题 + <title>），
# 以及文章页底部 show_links 的友链组件（小标题）。两处说的本来就是
# 同一件事，拆成两个键只会让译者困惑该改哪个。
links:
  title: 收藏站点
  stats: '%d 个站 · %d 个分类'
  uncategorized: 未分类
  empty_title: 这里还没有收藏任何站点
  empty_hint: 在 source/_data/bookmarks.yml 里加一条，或打开 bookmarks.remote 从 hub 拉取。

